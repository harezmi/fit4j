name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  library:
    name: Library (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [17, 25]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew test --no-daemon

  examples:
    name: Examples (JDK 25)
    runs-on: ubuntu-latest
    needs: library
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Publish FIT4J to Maven Local
        run: ./gradlew publishToMavenLocal -x signMavenPublication --no-daemon

      - name: Test examples
        working-directory: fit4j-examples
        run: ../gradlew test --no-daemon
